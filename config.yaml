# Volatility Mispricing Engine - Configuration
# All thresholds and weights are overridable via environment variables.

app:
  name: "volatility-mispricing-engine"
  version: "1.0.0"
  environment: "development"  # development | production
  log_level: "INFO"

etoro:
  # Set ETORO_API_KEY and ETORO_BASE_URL as env vars in production
  base_url: "https://public-api.etoro.com"
  api_key: ""  # injected via ETORO_API_KEY env var
  timeout_seconds: 30
  # Use mock client for tests / development
  use_mock: true

universe:
  # Default tickers to scan; override via POST /run body
  tickers:
    - "AAPL"
    - "MSFT"
    - "AMZN"
    - "GOOGL"
    - "TSLA"
    - "NVDA"
    - "META"
    - "SPY"
    - "QQQ"
    - "IWM"

risk_free_rate: 0.045  # 4.5% annualised; override as needed

realized_vol:
  window_20d: 20
  window_60d: 60
  ewma_lambda: 0.94
  # Blend weights: [20d, 60d, ewma] - must sum to 1.0
  blend_weights: [0.25, 0.25, 0.50]

filters:
  max_bid_ask_spread_pct: 0.10   # 10% of mid
  min_open_interest: 200
  min_days_to_expiry: 3
  max_days_to_expiry: 180

scoring:
  top_n: 20
  slippage_factor: 0.001  # slippage_proxy = slippage_factor * mid

phase2:
  enabled: true
  momentum_window: 20         # days for return percentile
  earnings_penalty_days: 14   # penalise if earnings within N days
  news_sentiment_enabled: false
  weights:
    base_score: 0.70
    momentum: 0.15
    earnings_penalty: -0.10
    sentiment: 0.05

llm:
  provider: "openai"           # openai | mock
  model: "gpt-4o-mini"
  max_tokens: 300
  temperature: 0.2
  # Set OPENAI_API_KEY as env var in production
  api_key: ""

api:
  host: "0.0.0.0"
  port: 8000
  workers: 1

scheduler:
  enabled: false
  cron: "0 18 * * 1-5"  # 18:00 UTC on market days (Mon-Fri)

persistence:
  results_dir: "./data/results"
  run_hashes_file: "./data/run_hashes.json"

# ─── News Pipeline ───────────────────────────────────────────────────────────
news:
  enabled: true
  # News provider: fmp | financial_datasets | finnhub | mock
  # Set FMP_API_KEY (or FINANCIAL_DATASETS_API_KEY / FINNHUB_API_KEY) in env.
  # Falls back to "mock" when provider API key is absent.
  provider: "mock"
  # Number of top Phase-1 candidates to enrich with news (keep small for cost)
  top_k_for_news: 50
  lookback_hours: 72
  max_articles_per_ticker: 20
  # Path for per-run news article cache (keyed by ticker+date+lookback)
  cache_dir: "./data/news_cache"

  # Score adjustment parameters (all deterministic code — not LLM)
  # alpha_sentiment: multiplier strength for overall sentiment signal
  alpha_sentiment: 0.15
  # alpha_catalyst: multiplier strength for per-catalyst directional effect
  alpha_catalyst: 0.10
  # beta_risk: penalty/boost strength for each risk flag
  beta_risk: 0.20
  # event_risk_mode: "avoid" penalises earnings risk; "seek" boosts it
  event_risk_mode: "avoid"

  # LLM provider for feature extraction (openai | mock)
  # Set OPENAI_API_KEY for openai; falls back to "mock" without a key.
  llm_provider: "mock"
  llm_model: "gpt-4o-mini"
  llm_max_tokens: 800
  llm_temperature: 0.0

  # Rate-limit: max news API calls per run (prevents hammering provider)
  max_api_calls_per_run: 100
