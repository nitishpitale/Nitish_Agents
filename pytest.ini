[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
log_cli = true
log_cli_level = WARNING
addopts =
    --tb=short
    -v
    --strict-markers
markers =
    unit: Unit tests (fast, no I/O)
    integration: Integration tests (mock MCP, end-to-end)
    slow: Slow tests
